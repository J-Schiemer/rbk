name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5

      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(uv run python -c "import rbk; print(rbk.__version__)")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match rbk.__version__ $version" >&2
            exit 1
          fi

      - name: Test and lint
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Build
        run: uv build

      - name: Checksum source archive
        id: sha
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl -fsSL "$url" -o source.tar.gz
          sha=$(shasum -a 256 source.tar.gz | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "rbk $GITHUB_REF_NAME" \
            --generate-notes

      - name: Update Homebrew formula in tap
        env:
          SHA256: ${{ steps.sha.outputs.sha256 }}
          URL: ${{ steps.sha.outputs.url }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/J-Schiemer/homebrew-tap.git" tap
          sed -i -E \
            -e "s|^  url \".*\"$|  url \"${URL}\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"${SHA256}\"|" \
            Formula/rbk.rb
          cp Formula/rbk.rb tap/Formula/rbk.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "formula already up to date"
            exit 0
          fi
          git add Formula/rbk.rb
          git commit -m "chore: bump rbk to ${GITHUB_REF_NAME}"
          git push
